name: Build

# Stage 1: everything compiles and the jar assembles. No tests run here.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Compile and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile and package
        run: ./mvnw -B -ntp -DskipTests package

      - name: Upload the application jar
        uses: actions/upload-artifact@v5
        with:
          name: application-jar
          path: target/*.jar
          retention-days: 7
          if-no-files-found: ignore
