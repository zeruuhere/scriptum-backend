name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  INSTANCE_NAME_TAG: ${{ vars.INSTANCE_NAME_TAG || 'scriptum-app' }}
  SERVICE: backend

jobs:
  deploy:
    name: Deploy to EC2
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Find the running instance
        id: instance
        run: |
          id=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$INSTANCE_NAME_TAG" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)
          if [ -z "$id" ] || [ "$id" = "None" ]; then
            echo "No running instance tagged $INSTANCE_NAME_TAG"
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

          ip=$(aws ec2 describe-instances \
            --instance-ids "$id" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          echo "ip=$ip" >> "$GITHUB_OUTPUT"

      - name: Pull and rebuild the service
        id: deploy
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
        run: |
          cat > params.json <<JSON
          {
            "commands": [
              "set -euxo pipefail",
              "cd /opt/scriptum/$SERVICE",
              "git fetch --depth 1 origin main",
              "git reset --hard FETCH_HEAD",
              "cd /opt/scriptum",
              "docker compose up -d --build $SERVICE",
              "docker compose ps"
            ],
            "executionTimeout": ["3600"]
          }
          JSON

          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy $SERVICE ${GITHUB_SHA::7}" \
            --parameters file://params.json \
            --query Command.CommandId \
            --output text)
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"

          for _ in $(seq 1 120); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success)
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Undeliverable|Terminated)
                echo "Deploy command finished with status $status"
                exit 1
                ;;
            esac
            sleep 15
          done

          echo "Deploy command did not finish in time"
          exit 1

      - name: Show remote output
        if: always() && steps.deploy.outputs.command_id != ''
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent \
            --output text
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent \
            --output text >&2

      - name: Wait for the API to answer
        env:
          APP_IP: ${{ steps.instance.outputs.ip }}
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 5 "http://$APP_IP/api/auth/health" > /dev/null; then
              echo "API is up at http://$APP_IP/api"
              exit 0
            fi
            sleep 10
          done
          echo "API did not answer after the deploy"
          exit 1
