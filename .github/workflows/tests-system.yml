name: System tests

# Stage 4: the assembled system. *SystemIT tests boot the whole application on a
# random port and drive it over real HTTP - no MockMvc, so the servlet container
# and the full filter chain are in the path. The only stub is JavaMailSender,
# because SMTP is a third-party system and registration sends a verification
# message without catching failures.
#
# Gated behind the `system-tests` Maven profile so they never run as part of the
# earlier stages.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: End-to-end API journeys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run system tests
        run: ./mvnw -B -ntp -Psystem-tests verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: system-test-reports
          path: target/failsafe-reports/
          retention-days: 7
          if-no-files-found: ignore
