name: Unit tests

# Stage 2: fast, isolated tests.
#   Surefire (*Test) - services, JWT, filter and mappers with Mockito, plus the
#   @WebMvcTest controller slices. No real database, no server.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Surefire unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Surefire tests
        run: ./mvnw -B -ntp test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-reports
          path: target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore
